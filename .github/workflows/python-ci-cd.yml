# =========================================================
# 🚀 GitHub Actions CI/CD - Python 3.12
# Archivo:
# .github/workflows/python-ci-cd.yml
# =========================================================

name: Python CI/CD

# =========================================================
# 🔥 Ejecutar automáticamente
# =========================================================
on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

# =========================================================
# 🌎 Variables globales
# =========================================================
env:
  PYTHON_VERSION: "3.12"

# =========================================================
# ⚙️ Jobs
# =========================================================
jobs:

  # =======================================================
  # 🧪 TEST + BUILD
  # =======================================================
  test:
    runs-on: ubuntu-latest

    steps:

      # ===================================================
      # 📥 Clonar repositorio
      # ===================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===================================================
      # 🐍 Instalar Python 3.12
      # ===================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ===================================================
      # ⚡ Cache dependencias pip
      # ===================================================
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ===================================================
      # 📦 Instalar dependencias
      # ===================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ===================================================
      # 🔍 Lint proyecto
      # ===================================================
      - name: Install lint tools
        run: |
          pip install flake8 black isort

      # ===================================================
      # 🧹 Revisar formato
      # ===================================================
      - name: Run Black
        run: |
          black --check .

      # ===================================================
      # 📚 Orden imports
      # ===================================================
      - name: Run isort
        run: |
          isort --check-only .

      # ===================================================
      # 🔎 Linter
      # ===================================================
      - name: Run flake8
        run: |
          flake8 . --count --show-source --statistics

      # ===================================================
      # 🧪 Ejecutar tests
      # ===================================================
      - name: Run tests
        run: |
          pip install pytest

          if [ -d tests ]; then
            pytest
          else
            echo "No tests folder found"
          fi

  # =======================================================
  # 🚀 DEPLOY
  # =======================================================
  deploy:
    runs-on: ubuntu-latest

    needs: test

    # =====================================================
    # 🚀 Solo deploy en main
    # =====================================================
    if: github.ref == 'refs/heads/main'

    steps:

      # ===================================================
      # 📥 Clonar repositorio
      # ===================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===================================================
      # 🐍 Python 3.12
      # ===================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ===================================================
      # 📦 Instalar dependencias
      # ===================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ===================================================
      # 🚀 Deploy Render
      # ===================================================
      - name: Trigger Render Deploy
        if: success()
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # ===================================================
      # 🚀 Deploy Vercel (opcional)
      # ===================================================
      # - name: Deploy Vercel
      #   run: |
      #     npm install -g vercel
      #
      #     vercel deploy \
      #       --prod \
      #       --token=${{ secrets.VERCEL_TOKEN }}

      # ===================================================
      # 🚀 Deploy Firebase (opcional)
      # ===================================================
      # - name: Deploy Firebase
      #   run: |
      #     npm install -g firebase-tools
      #
      #     firebase deploy --token "${{ secrets.FIREBASE_TOKEN }}"
