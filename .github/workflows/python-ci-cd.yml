name: Python CI/CD

# =========================================================
# 🚀 EVENTS
# =========================================================
on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

# =========================================================
# 🔄 CANCEL DUPLICATE RUNS
# =========================================================
concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

# =========================================================
# 🌎 GLOBAL ENVIRONMENT VARIABLES
# =========================================================
env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# =========================================================
# ⚙️ JOBS
# =========================================================
jobs:

  # =======================================================
  # 🧪 TESTS + CODE QUALITY
  # =======================================================
  test:
    name: 🧪 Tests & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ===================================================
      # 📥 CHECKOUT
      # ===================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ===================================================
      # 🐍 SETUP PYTHON
      # ===================================================
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ===================================================
      # 📦 INSTALL DEPENDENCIES
      # ===================================================
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements.txt ]; then
            echo "📦 Installing requirements.txt"
            pip install -r requirements.txt
          else
            echo "⚠️ requirements.txt not found"
          fi

          echo "📦 Installing development tools"
          pip install black isort flake8 pytest pytest-cov

      # ===================================================
      # 🧹 BLACK FORMAT CHECK
      # ===================================================
      - name: 🧹 Check formatting with Black
        run: |
          black . --check --diff

      # ===================================================
      # 📚 ISORT IMPORTS CHECK
      # ===================================================
      - name: 📚 Check imports with isort
        run: |
          isort . \
            --check-only \
            --diff \
            --profile black

      # ===================================================
      # 🔎 FLAKE8 LINT
      # ===================================================
      - name: 🔎 Run flake8
        run: |
          flake8 . \
            --count \
            --statistics \
            --show-source \
            --max-line-length=88 \
            --extend-ignore=E203,W503

      # ===================================================
      # 🧪 PYTEST
      # ===================================================
      - name: 🧪 Run tests
        run: |
          if [ -d tests ]; then
            pytest tests/ \
              -v \
              --tb=short \
              --disable-warnings \
              --maxfail=5
          else
            echo "⚠️ No tests directory found"
          fi

  # =======================================================
  # 🚀 OPTIONAL RENDER DEPLOY
  # =======================================================
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: test

    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    steps:

      # ===================================================
      # 📥 CHECKOUT
      # ===================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ===================================================
      # 🔍 CHECK RENDER SECRET
      # ===================================================
      - name: 🔍 Check Render Secret
        id: render_secret_check

        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "⚠️ RENDER_DEPLOY_HOOK_URL not configured"
          else
            echo "has_secret=true" >> $GITHUB_OUTPUT
            echo "✅ Render deploy secret found"
          fi

      # ===================================================
      # 🚀 TRIGGER RENDER DEPLOY
      # ===================================================
      - name: 🚀 Trigger Render Deploy

        if: steps.render_secret_check.outputs.has_secret == 'true'

        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

        run: |
          echo "🚀 Triggering Render deployment..."

          response=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL")

          # ===============================================
          # VALIDATE RESPONSE
          # ===============================================
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✅ Render deployment triggered successfully"
          else
            echo "❌ Render deployment failed with HTTP status $response"
            exit 1
          fi

      # ===================================================
      # ⏭️ SKIP DEPLOY
      # ===================================================
      - name: ⏭️ Skip Deploy

        if: steps.render_secret_check.outputs.has_secret != 'true'

        run: |
          echo "⚠️ Deploy skipped because RENDER_DEPLOY_HOOK_URL is missing"
