# ======================================================
# 🚀 RENDER CONFIGURATION
# ======================================================

services:

  # ====================================================
  # 🌐 STREAMLIT WEB SERVICE
  # ====================================================
  - type: web

    # ------------------------------------------------
    # 📛 SERVICE NAME
    # ------------------------------------------------
    name: python-dashboard

    # ------------------------------------------------
    # 🐍 RUNTIME
    # ------------------------------------------------
    runtime: python

    # ------------------------------------------------
    # 🌎 REGION
    # ------------------------------------------------
    region: oregon

    # ------------------------------------------------
    # 💻 INSTANCE PLAN
    # ------------------------------------------------
    plan: free

    # ------------------------------------------------
    # 🌿 DEPLOY BRANCH
    # ------------------------------------------------
    branch: main

    # ------------------------------------------------
    # ⚡ AUTO DEPLOY
    # ------------------------------------------------
    autoDeploy: true

    # ------------------------------------------------
    # 📦 BUILD COMMAND
    # ------------------------------------------------
    buildCommand: |
      python -m pip install --upgrade pip setuptools wheel
      pip install --no-cache-dir -r requirements.txt

    # ------------------------------------------------
    # 🚀 START COMMAND
    # ------------------------------------------------
    startCommand: |
      python -m streamlit run app.py \
      --server.port $PORT \
      --server.address 0.0.0.0 \
      --server.headless true \
      --browser.gatherUsageStats false

    # ------------------------------------------------
    # ❤️ HEALTH CHECK
    # ------------------------------------------------
    healthCheckPath: /

    # ------------------------------------------------
    # 🔐 ENVIRONMENT VARIABLES
    # ------------------------------------------------
    envVars:

      # =============================================
      # PYTHON VERSION
      # =============================================
      - key: PYTHON_VERSION
        value: 3.12.10

      # =============================================
      # APP ENVIRONMENT
      # =============================================
      - key: ENVIRONMENT
        value: production

      # =============================================
      # PYTHON SETTINGS
      # =============================================
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"

      - key: PYTHONUNBUFFERED
        value: "1"

      # =============================================
      # STREAMLIT SETTINGS
      # =============================================
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"

      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"

      # =============================================
      # SECRET KEY
      # =============================================
      - key: SECRET_KEY
        sync: false

      # =============================================
      # DATABASE URL
      # =============================================
      - key: DATABASE_URL
        fromDatabase:
          name: python-dashboard-db
          property: connectionString

# ======================================================
# 🗄️ POSTGRES DATABASE
# ======================================================
databases:

  - name: python-dashboard-db

    # ------------------------------------------------
    # DATABASE PLAN
    # ------------------------------------------------
    plan: free

    # ------------------------------------------------
    # REGION
    # ------------------------------------------------
    region: oregon

    # ------------------------------------------------
    # POSTGRES VERSION
    # ------------------------------------------------
    postgresMajorVersion: 16
