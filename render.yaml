# ======================================================
# 🚀 RENDER CONFIGURATION
# ======================================================

services:

  # ====================================================
  # 🌐 WEB SERVICE
  # ====================================================
  - type: web

    # ------------------------------------------------
    # 📛 SERVICE NAME
    # ------------------------------------------------
    name: python-dashboard

    # ------------------------------------------------
    # 🐍 RUNTIME
    # ------------------------------------------------
    runtime: python

    # ------------------------------------------------
    # 🌎 REGION
    # ------------------------------------------------
    region: oregon

    # ------------------------------------------------
    # 💻 INSTANCE PLAN
    # ------------------------------------------------
    plan: free

    # ------------------------------------------------
    # 🌿 BRANCH
    # ------------------------------------------------
    branch: main

    # ------------------------------------------------
    # ⚡ AUTO DEPLOY
    # ------------------------------------------------
    autoDeploy: true

    # ------------------------------------------------
    # 📦 BUILD COMMAND
    # ------------------------------------------------
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    # ------------------------------------------------
    # 🚀 START COMMAND
    # ------------------------------------------------
    startCommand: |
      gunicorn app:app

    # ------------------------------------------------
    # ❤️ HEALTH CHECK
    # ------------------------------------------------
    healthCheckPath: /

    # ------------------------------------------------
    # 🔐 ENVIRONMENT VARIABLES
    # ------------------------------------------------
    envVars:

      # =============================================
      # PYTHON VERSION
      # =============================================
      - key: PYTHON_VERSION
        value: 3.12.10

      # =============================================
      # ENVIRONMENT
      # =============================================
      - key: ENVIRONMENT
        value: production

      # =============================================
      # PYTHON SETTINGS
      # =============================================
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"

      - key: PYTHONUNBUFFERED
        value: "1"

      # =============================================
      # SECRET KEY
      # =============================================
      - key: SECRET_KEY
        sync: false

      # =============================================
      # DATABASE URL
      # =============================================
      - key: DATABASE_URL
        fromDatabase:
          name: python-dashboard-db
          property: connectionString

# ======================================================
# 🗄️ POSTGRES DATABASE
# ======================================================
databases:

  - name: python-dashboard-db

    # ------------------------------------------------
    # DATABASE PLAN
    # ------------------------------------------------
    plan: free

    # ------------------------------------------------
    # REGION
    # ------------------------------------------------
    region: oregon

    # ------------------------------------------------
    # DATABASE VERSION
    # ------------------------------------------------
    postgresMajorVersion: 16
