
[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

# =========================================================
# 📦 PROJECT METADATA
# =========================================================
[project]
name = "python-dashboard"
version = "0.1.0"
description = "Modern Streamlit Python Dashboard"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Luiggi Reyna" }
]

dependencies = []

# =========================================================
# 🖤 BLACK
# =========================================================
[tool.black]
line-length = 88
target-version = ["py312"]

include = '\.pyi?$'

extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | build
  | dist
  | node_modules
  | migrations
  | alembic/versions
)/
'''

# =========================================================
# ⚡ ISORT
# =========================================================
[tool.isort]
profile = "black"
line_length = 88
py_version = 312

multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

skip = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "node_modules",
    "migrations",
    "alembic/versions",
]

# =========================================================
# 🚀 RUFF
# =========================================================
[tool.ruff]
target-version = "py312"
line-length = 88

exclude = [
    ".git",
    ".github",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "node_modules",
    "migrations",
    "alembic/versions",
]

# =========================================================
# 🔎 RUFF LINT RULES
# =========================================================
[tool.ruff.lint]

select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "RET",  # returns
    "RUF",  # ruff-specific
]

ignore = [
    "E203", # black compatibility
]

fixable = ["ALL"]

# =========================================================
# 🎨 RUFF FORMAT
# =========================================================
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# =========================================================
# 🧪 PYTEST
# =========================================================
[tool.pytest.ini_options]

minversion = "8.0"

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = "-v -ra --tb=short --strict-markers --disable-warnings --color=yes"

filterwarnings = [
    "ignore::DeprecationWarning",
]

markers = [
    "slow: slow tests",
    "integration: integration tests",
    "unit: unit tests",
]

# =========================================================
# 📊 COVERAGE
# =========================================================
[tool.coverage.run]
branch = true

source = [
    "auth",
    "components",
    "database",
    "pages",
    "utils",
]

omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "*/site-packages/*",
    "alembic/versions/*",
]

# =========================================================
# 📈 COVERAGE REPORT
# =========================================================
[tool.coverage.report]

show_missing = true
skip_covered = true
precision = 2

exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "pass",
    "raise NotImplementedError",
]

# =========================================================
# 📦 SETUPTOOLS
# =========================================================
[tool.setuptools]
include-package-data = true
