
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-dashboard"
version = "0.1.0"
description = "Modern Python Dashboard"
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ["py312"]

include = '\.pyi?$'

extend-exclude = '''
/(
    \.git
  | \.github
  | \.venv
  | venv
  | env
  | ENV
  | __pycache__
  | \.pytest_cache
  | \.mypy_cache
  | \.ruff_cache
  | \.tox
  | build
  | dist
  | htmlcov
  | node_modules
  | migrations
  | alembic/versions
  | site-packages
)/'''

[tool.ruff]
target-version = "py312"
line-length = 88

exclude = [
    ".git",
    ".github",
    ".venv",
    "venv",
    "env",
    "ENV",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    "build",
    "dist",
    "htmlcov",
    "node_modules",
    "site-packages",
    "migrations",
    "alembic/versions",
]

[tool.ruff.lint]

select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "PIE", # misc lints
    "RET", # return rules
    "RUF", # Ruff-specific
]

ignore = [
    "E203",
]

fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"

testpaths = ["tests"]

python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = """
-v
-ra
--tb=short
--strict-markers
--disable-warnings
--color=yes
"""

filterwarnings = [
    "ignore::DeprecationWarning",
]

markers = [
    "slow: slow tests",
    "integration: integration tests",
    "unit: unit tests",
]

[tool.coverage.run]
branch = true

source = ["."]

omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "*/site-packages/*",
    "alembic/versions/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2

exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "pass",
    "raise NotImplementedError",
]

[tool.setuptools]
include-package-data = true
