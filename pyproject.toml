# =========================================================
# 🏗️ BUILD SYSTEM
# =========================================================
[build-system]
requires = [
    "setuptools>=70",
    "wheel",
]
build-backend = "setuptools.build_meta"

# =========================================================
# 📦 PROJECT METADATA
# =========================================================
[project]
name = "python-dashboard"
version = "0.1.0"
description = "Modern Streamlit Dashboard with Authentication and Analytics"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Luiggi Reyna" }
]

keywords = [
    "python",
    "streamlit",
    "dashboard",
    "analytics",
    "postgresql",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# =========================================================
# 🖤 BLACK
# =========================================================
[tool.black]
line-length = 88
target-version = ["py312"]

include = '\.pyi?$'

extend-exclude = '''
/(
    \.git
  | \.github
  | \.venv
  | venv
  | env
  | ENV
  | build
  | dist
  | htmlcov
  | node_modules
  | migrations
  | alembic/versions
  | site-packages
)/
'''

# =========================================================
# ⚡ ISORT
# =========================================================
[tool.isort]
profile = "black"
line_length = 88
py_version = 312

multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

skip = [
    ".git",
    ".github",
    ".venv",
    "venv",
    "env",
    "ENV",
    "build",
    "dist",
    "htmlcov",
    "node_modules",
    "migrations",
    "alembic/versions",
]

known_first_party = [
    "auth",
    "components",
    "database",
    "data",
    "pages",
    "utils",
]

# =========================================================
# 🚀 RUFF
# =========================================================
[tool.ruff]
target-version = "py312"
line-length = 88

exclude = [
    ".git",
    ".github",
    ".venv",
    "venv",
    "env",
    "ENV",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    "build",
    "dist",
    "htmlcov",
    "node_modules",
    "migrations",
    "alembic/versions",
]

# =========================================================
# 🔎 RUFF LINT
# =========================================================
[tool.ruff.lint]

select = [
    # pycodestyle
    "E",
    "W",

    # pyflakes
    "F",

    # isort
    "I",

    # pyupgrade
    "UP",

    # bugbear
    "B",

    # simplify
    "SIM",

    # comprehensions
    "C4",

    # return rules
    "RET",

    # Ruff-specific
    "RUF",
]

ignore = [
    # Black compatibility
    "E203",
]

fixable = ["ALL"]

# =========================================================
# 🎨 RUFF FORMAT
# =========================================================
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# =========================================================
# 🧪 PYTEST
# =========================================================
[tool.pytest.ini_options]

minversion = "8.0"

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = """
-v
-ra
--tb=short
--strict-markers
--disable-warnings
--color=yes
"""

filterwarnings = [
    "ignore::DeprecationWarning",
]

markers = [
    "slow: slow tests",
    "integration: integration tests",
    "unit: unit tests",
]

# =========================================================
# 📊 COVERAGE
# =========================================================
[tool.coverage.run]
branch = true

source = [
    "auth",
    "components",
    "database",
    "data",
    "pages",
    "utils",
]

omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "*/site-packages/*",
    "alembic/versions/*",
]

# =========================================================
# 📈 COVERAGE REPORT
# =========================================================
[tool.coverage.report]

show_missing = true
skip_covered = true
precision = 2

exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "pass",
    "raise NotImplementedError",
]

# =========================================================
# 📦 SETUPTOOLS
# =========================================================
[tool.setuptools]
include-package-data = true

# =========================================================
# 📁 PACKAGE DISCOVERY
# =========================================================
[tool.setuptools.packages.find]
exclude = [
    "tests",
    "tests.*",
    "venv",
    ".venv",
]

# =========================================================
# 🔥 OPTIONAL: MYPY
# =========================================================
[tool.mypy]
python_version = "3.12"

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

exclude = [
    "venv/",
    ".venv/",
    "build/",
    "dist/",
]

# =========================================================
# 🧹 OPTIONAL: BANDIT
# =========================================================
[tool.bandit]
exclude_dirs = [
    "tests",
    "venv",
    ".venv",
]

skips = [
    "B101",
]
