# =========================================================
# 🐍 BLACK
# =========================================================
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | migrations
  | __pycache__
)/
'''

# =========================================================
# 📚 ISORT
# =========================================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# =========================================================
# 🔎 FLAKE8
# =========================================================
[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",
    "W503",
    "E501"
]

per-file-ignores = [
    "__init__.py:F401",
    "pages/*.py:E501",
]
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "alembic"
]
# =========================================================
# 🧪 PYTEST
# =========================================================
[tool.pytest.ini_options]
pythonpath = [
    "."
]

testpaths = [
    "tests"
]

addopts = "-v --tb=short"

# =========================================================
# 🐍 PYTHON BUILD SYSTEM
# =========================================================
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
