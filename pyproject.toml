# =========================================================
# 🐍 PYPROJECT.TOML
# Centralized configuration:
# - Black
# - isort
# - Flake8
# - Pytest
# - Coverage
# - Build system
# =========================================================

# =========================================================
# 🧹 BLACK
# =========================================================
[tool.black]
line-length = 100
target-version = ["py312"]
include = "\\.pyi?$"

extend-exclude = """
/(
    \\.git
  | \\.github
  | \\.mypy_cache
  | \\.pytest_cache
  | \\.ruff_cache
  | \\.tox
  | \\.venv
  | venv
  | env
  | ENV
  | build
  | dist
  | site
  | htmlcov
  | node_modules
  | migrations
  | alembic/versions
  | __pycache__
)/
"""

# =========================================================
# 📚 ISORT
# =========================================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

ensure_newline_before_comments = true
combine_as_imports = true
force_sort_within_sections = true

lines_after_imports = 2

src_paths = ["."]
skip = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "htmlcov",
    "node_modules",
    "alembic/versions",
]

# =========================================================
# 🔎 FLAKE8
# =========================================================
[tool.flake8]
max-line-length = 100
max-complexity = 12

statistics = true
show-source = true
count = true

extend-ignore = [
    "E203",
    "W503",
]

exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "htmlcov",
    "node_modules",
    "alembic/versions",
]

per-file-ignores = [
    "__init__.py:F401",
    "alembic/env.py:E402",
]

# =========================================================
# 🧪 PYTEST
# =========================================================
[tool.pytest.ini_options]
minversion = "8.0"

pythonpath = ["."]
testpaths = ["tests"]

python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = """
-v
-ra
--tb=short
--strict-markers
--disable-warnings
--color=yes
"""

filterwarnings = [
    "ignore::DeprecationWarning",
]

markers = [
    "slow: slow tests",
    "integration: integration tests",
    "unit: unit tests",
]

# =========================================================
# 📊 COVERAGE
# =========================================================
[tool.coverage.run]
branch = true

source = ["."]
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
]

# =========================================================
# 📦 SETUPTOOLS
# =========================================================
[tool.setuptools]
include-package-data = true

# =========================================================
# 🏗️ BUILD SYSTEM
# =========================================================
[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]

build-backend = "setuptools.build_meta"
