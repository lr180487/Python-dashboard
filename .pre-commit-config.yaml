# =========================================================
# 🚀 PRE-COMMIT CONFIG
# =========================================================

minimum_pre_commit_version: "4.0.0"

default_language_version:
  python: python3.12

default_stages:
  - pre-commit

fail_fast: false

# =========================================================
# 🚫 GLOBAL EXCLUDES
# =========================================================
exclude: |
  (?x)^(
      \.git/|
      \.github/|
      \.venv/|
      venv/|
      env/|
      ENV/|
      build/|
      dist/|
      site/|
      htmlcov/|
      \.mypy_cache/|
      \.pytest_cache/|
      \.ruff_cache/|
      \.tox/|
      __pycache__/|
      node_modules/|
      migrations/|
      alembic/versions/|
      coverage\.xml|
      package-lock\.json
  )

repos:

  # ======================================================
  # 🧹 BLACK - CODE FORMATTER
  # ======================================================
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        name: black-format
        language_version: python3.12
        args:
          - --config=pyproject.toml

  # ======================================================
  # 📚 ISORT - IMPORT SORTER
  # ======================================================
  - repo: https://github.com/PyCQA/isort
    rev: 6.0.1
    hooks:
      - id: isort
        name: isort-imports
        args:
          - --settings-path=pyproject.toml

  # ======================================================
  # 🔎 FLAKE8 - PYTHON LINTER
  # ======================================================
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: flake8-lint
        additional_dependencies:
          - flake8-bugbear
          - flake8-pyproject
        args:
          - --config=pyproject.toml

  # ======================================================
  # 🧪 PYTEST
  # ======================================================
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        stages:
          - pre-push

  # ======================================================
  # 🛠️ COMMON FILE FIXES
  # ======================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:

      # --------------------------------------------------
      # ✨ Formatting
      # --------------------------------------------------
      - id: trailing-whitespace

      - id: end-of-file-fixer

      - id: mixed-line-ending
        args:
          - --fix=lf

      # --------------------------------------------------
      # ✅ Validation
      # --------------------------------------------------
      - id: check-yaml

      - id: check-json

      - id: check-toml

      - id: check-xml

      # --------------------------------------------------
      # 🔒 Safety Checks
      # --------------------------------------------------
      - id: check-merge-conflict

      - id: debug-statements

      - id: detect-private-key

      # --------------------------------------------------
      # 📦 File Checks
      # --------------------------------------------------
      - id: check-added-large-files
        args:
          - --maxkb=2048

      - id: check-symlinks

      - id: check-case-conflict
