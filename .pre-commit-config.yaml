# =========================================================
# 🚀 PRE-COMMIT CONFIG
# =========================================================

minimum_pre_commit_version: "4.0.0"

default_language_version:
  python: python3.12

default_stages:
  - pre-commit

fail_fast: false

exclude: |
  (?x)^(
      venv/|
      \.venv/|
      env/|
      ENV/|
      build/|
      dist/|
      site/|
      htmlcov/|
      \.mypy_cache/|
      \.pytest_cache/|
      \.ruff_cache/|
      \.tox/|
      __pycache__/|
      node_modules/|
      migrations/|
      alembic/versions/|
      coverage.xml|
      package-lock.json
  )

repos:

  # ======================================================
  # 🧹 BLACK - CODE FORMATTER
  # ======================================================
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3.12

  # ======================================================
  # 📚 ISORT - IMPORT SORTER
  # ======================================================
  - repo: https://github.com/PyCQA/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args:
          - --settings-path=pyproject.toml

  # ======================================================
  # 🔎 FLAKE8 - PYTHON LINTER
  # ======================================================
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-bugbear
          - flake8-pyproject

  # ======================================================
  # 🧪 PYTEST
  # ======================================================
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        stages:
          - pre-push

  # ======================================================
  # 🛠️ COMMON FILE FIXES
  # ======================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:

      # Remove trailing whitespace
      - id: trailing-whitespace

      # Ensure newline at EOF
      - id: end-of-file-fixer

      # Normalize line endings
      - id: mixed-line-ending
        args:
          - --fix=lf

      # Validate YAML
      - id: check-yaml

      # Validate JSON
      - id: check-json

      # Validate TOML
      - id: check-toml

      # Validate XML
      - id: check-xml

      # Detect merge conflicts
      - id: check-merge-conflict

      # Detect debug statements
      - id: debug-statements

      # Prevent large files
      - id: check-added-large-files
        args:
          - --maxkb=2048

      # Validate symlinks
      - id: check-symlinks

      # Prevent filename case conflicts
      - id: check-case-conflict

      # Detect private keys
      - id: detect-private-key
