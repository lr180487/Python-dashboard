# =========================================================
# 🚀 PRE-COMMIT CONFIG
# =========================================================

minimum_pre_commit_version: "4.0.0"

default_language_version:
  python: python3.12

default_stages: [pre-commit]

fail_fast: false

# =========================================================
# 🚫 GLOBAL EXCLUDES
# =========================================================
exclude: |
  (?x)^(
      \.git/|
      \.github/|
      \.venv/|
      venv/|
      env/|
      ENV/|
      build/|
      dist/|
      site/|
      htmlcov/|
      \.mypy_cache/|
      \.pytest_cache/|
      \.ruff_cache/|
      \.tox/|
      __pycache__/|
      node_modules/|
      coverage\.xml|
      package-lock\.json
  )

# =========================================================
# 🔥 REPOSITORIES / HOOKS
# =========================================================
repos:

  # =======================================================
  # ⚡ RUFF (LINTER + FORMATTER)
  # =======================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:

      # Linter + auto-fix
      - id: ruff
        args:
          - --fix
          - --exit-non-zero-on-fix

      # Formatter
      - id: ruff-format

  # =======================================================
  # 🖤 BLACK
  # =======================================================
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3.12

  # =======================================================
  # 🧹 GENERIC FILE CHECKS
  # =======================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:

      # Remove trailing spaces
      - id: trailing-whitespace

      # Final newline
      - id: end-of-file-fixer

      # Normalize line endings
      - id: mixed-line-ending
        args: [--fix=lf]

      # Validate YAML
      - id: check-yaml

      # Validate TOML
      - id: check-toml

      # Validate JSON
      - id: check-json

      # Prevent debug leftovers
      - id: debug-statements

      # Detect private keys
      - id: detect-private-key

      # Detect merge conflicts
      - id: check-merge-conflict

      # Prevent giant files
      - id: check-added-large-files
        args: ["--maxkb=2048"]
