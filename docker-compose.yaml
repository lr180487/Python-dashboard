# docker-compose.yaml
# Stack: Streamlit (Python) + PostgreSQL (Alpine)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: dashboard-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Override para usar el servicio 'db' dentro de Docker network
      DATABASE_URL: postgresql+psycopg://root:root@db:5432/sandbox
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_HEADLESS: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: dashboard-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: sandbox
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d sandbox"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
